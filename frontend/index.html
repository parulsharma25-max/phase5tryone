<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ask Gemini</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Ask Gemini </h1>

        <p>Ask me anything!</p>

        <input 
            type="text" 
            id="question"
            placeholder="Type your question..."
        >

        <button id="askButton">
            Ask Gemini
        </button>

        <p id="loading"></p>

        <div id="answer"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
